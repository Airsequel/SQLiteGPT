[package]
name = "sqlitegpt-core"
version = "0.2.0"
edition = "2021"
description = "Core logic for the SQLiteGPT loadable extension"
license = "ISC"
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["functions"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
# Tests link against a real SQLite via the bundled feature; the cdylib release
# build doesn't pull dev-dependencies in, so the `loadable_extension` feature
# selected by the parent crate still wins there.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
